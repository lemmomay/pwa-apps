<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA 生成器</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0c0c14; }
        input:focus, select:focus, button:focus { outline: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0c0c14; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useCallback } = React;

        const DEFAULT_CONFIG = {
            url: "https://example.com",
            name: "My App",
            shortName: "App",
            description: "My PWA App",
            themeColor: "#1a1a2e",
            bgColor: "#0f0f1a",
            accentColor: "#e94560",
            display: "standalone",
            orientation: "any",
            enableOffline: true,
            enableNavBar: true,
        };

        function generateManifest(cfg) {
            return JSON.stringify({
                name: cfg.name,
                short_name: cfg.shortName,
                description: cfg.description,
                start_url: "./",
                display: cfg.display,
                orientation: cfg.orientation,
                theme_color: cfg.themeColor,
                background_color: cfg.bgColor,
                icons: [
                    { src: "icons/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any maskable" },
                    { src: "icons/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" },
                ],
                categories: ["entertainment"],
            }, null, 2);
        }

        function generateSW(cfg) {
            return `const CACHE_NAME = '${cfg.shortName.toLowerCase().replace(/\s/g, "-")}-v1';
const OFFLINE_URL = './offline.html';
const PRECACHE_ASSETS = ['./', './index.html', './offline.html', './manifest.json'];

self.addEventListener('install', event => {
    event.waitUntil((async () => {
        const cache = await caches.open(CACHE_NAME);
        await cache.addAll(PRECACHE_ASSETS);
        await self.skipWaiting();
    })());
});

self.addEventListener('activate', event => {
    event.waitUntil((async () => {
        const keys = await caches.keys();
        await Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)));
        await self.clients.claim();
    })());
});

self.addEventListener('fetch', event => {
    if (event.request.mode === 'navigate') {
        event.respondWith((async () => {
            try { return await fetch(event.request); }
            catch { return (await caches.open(CACHE_NAME)).match(OFFLINE_URL); }
        })());
        return;
    }
    event.respondWith((async () => {
        const cached = await caches.match(event.request);
        if (cached) return cached;
        try {
            const response = await fetch(event.request);
            if (response.ok && event.request.method === 'GET') {
                const cache = await caches.open(CACHE_NAME);
                cache.put(event.request, response.clone());
            }
            return response;
        } catch { return new Response('Network error', { status: 408 }); }
    })());
});`;
        }

        function generateOffline(cfg) {
            return `<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${cfg.name} - 离线</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: ${cfg.bgColor}; color: #fff; font-family: 'Segoe UI', sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; text-align: center; padding: 2rem; }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; animation: pulse 2s infinite; }
    h1 { font-size: 1.8rem; margin-bottom: 0.8rem; color: ${cfg.accentColor}; }
    p { color: #aaa; margin-bottom: 2rem; line-height: 1.6; }
    button { background: ${cfg.accentColor}; color: #fff; border: none;
        padding: 0.8rem 2rem; border-radius: 999px; font-size: 1rem;
        cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.85; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
</style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>你已离线</h1>
    <p>当前没有网络连接。<br>请检查网络后重试。</p>
    <button onclick="window.location.reload()">重新连接</button>
</body>
</html>`;
        }

        function generateIndex(cfg) {
            const navBar = cfg.enableNavBar ? `
    <div id="nav-bar">
        <button id="btn-back" onclick="goBack()" title="后退">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button id="btn-forward" onclick="goForward()" title="前进">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div id="url-display" onclick="showAddressBar()"></div>
        <button id="btn-refresh" onclick="refreshFrame()" title="刷新">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <button id="btn-home" onclick="goHome()" title="主页">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
    </div>` : '';

            const navStyle = cfg.enableNavBar ? `
    #nav-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
        background: ${cfg.themeColor}ee; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        display: flex; align-items: center; gap: 4px; padding: 6px 8px;
        border-bottom: 1px solid rgba(255,255,255,0.08); height: 52px; }
    #nav-bar button { background: rgba(255,255,255,0.08); border: none; color: #fff;
        width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center;
        justify-content: center; cursor: pointer; transition: background 0.15s; flex-shrink: 0; }
    #nav-bar button:hover { background: rgba(255,255,255,0.16); }
    #nav-bar button:active { background: rgba(255,255,255,0.24); transform: scale(0.94); }
    #url-display { flex: 1; background: rgba(255,255,255,0.07); border-radius: 8px;
        height: 36px; padding: 0 12px; display: flex; align-items: center;
        color: rgba(255,255,255,0.6); font-size: 13px; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: background 0.15s; }
    #url-display:hover { background: rgba(255,255,255,0.12); }
    #webview { margin-top: 52px; height: calc(100vh - 52px); }` : '';

            return `<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="${cfg.themeColor}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="${cfg.shortName}">
<meta name="mobile-web-app-capable" content="yes">
<title>${cfg.name}</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: ${cfg.bgColor}; }
    #splash { position: fixed; inset: 0; z-index: 9999; background: ${cfg.bgColor};
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 24px; transition: opacity 0.5s ease, visibility 0.5s ease; }
    #splash.hidden { opacity: 0; visibility: hidden; }
    .splash-logo { width: 96px; height: 96px; border-radius: 22px; background: ${cfg.accentColor};
        display: flex; align-items: center; justify-content: center; font-size: 2.8rem;
        box-shadow: 0 0 60px ${cfg.accentColor}66; animation: logoIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .splash-title { color: #fff; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.02em;
        animation: fadeUp 0.5s ease 0.2s both; }
    .splash-loader { width: 180px; height: 3px; background: rgba(255,255,255,0.1);
        border-radius: 999px; overflow: hidden; animation: fadeUp 0.5s ease 0.3s both; }
    .splash-loader-bar { height: 100%; background: ${cfg.accentColor};
        border-radius: 999px; width: 0%; animation: loading 1.8s ease forwards; }
    @keyframes logoIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
    @keyframes fadeUp { from{transform:translateY(12px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes loading { 0%{width:0%} 60%{width:75%} 100%{width:100%} }
    #webview { width: 100%; height: 100vh; border: none; display: block; background: ${cfg.bgColor}; }
    ${navStyle}
    #addr-prompt { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.7);
        backdrop-filter: blur(8px); display: none; align-items: flex-start; justify-content: center;
        padding-top: 60px; }
    #addr-prompt.open { display: flex; }
    #addr-input-wrap { background: #222; border-radius: 14px; padding: 12px;
        width: calc(100% - 32px); max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    #addr-input { width: 100%; background: #333; border: none; color: #fff;
        border-radius: 8px; padding: 10px 14px; font-size: 15px; outline: none; }
    #addr-hint { color: #666; font-size: 12px; margin-top: 8px; padding: 0 4px; }
</style>
</head>
<body>
<div id="splash">
    <div class="splash-logo">🎬</div>
    <div class="splash-title">${cfg.name}</div>
    <div class="splash-loader"><div class="splash-loader-bar"></div></div>
</div>
${navBar}
<iframe id="webview" src="${cfg.url}"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation allow-modals"
    allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<div id="addr-prompt" onclick="closeAddressBar(event)">
    <div id="addr-input-wrap">
        <input id="addr-input" type="url" placeholder="输入网址..." autocomplete="off" onkeydown="handleAddrKey(event)">
        <div id="addr-hint">按 Enter 跳转 · 点击外部关闭</div>
    </div>
</div>
<script>
const HOME_URL = '${cfg.url}';
const frame = document.getElementById('webview');
const splash = document.getElementById('splash');
const urlDisplay = document.getElementById('url-display');
frame.addEventListener('load', () => { setTimeout(() => { splash.classList.add('hidden'); }, 400); updateUrlDisplay(); });
setTimeout(() => { splash.classList.add('hidden'); }, 2500);
function updateUrlDisplay() { try { const u = frame.contentWindow?.location?.href || HOME_URL; if (urlDisplay) urlDisplay.textContent = u.replace(/^https?:\\/\\//, ''); } catch(e) { if (urlDisplay) urlDisplay.textContent = HOME_URL.replace(/^https?:\\/\\//, ''); } }
function goBack() { try { frame.contentWindow.history.back(); } catch(e) {} }
function goForward() { try { frame.contentWindow.history.forward(); } catch(e) {} }
function refreshFrame() { try { frame.contentWindow.location.reload(); } catch(e) { frame.src = frame.src; } }
function goHome() { frame.src = HOME_URL; }
function showAddressBar() { document.getElementById('addr-prompt').classList.add('open'); document.getElementById('addr-input').focus(); }
function closeAddressBar(e) { if (e.target === document.getElementById('addr-prompt')) document.getElementById('addr-prompt').classList.remove('open'); }
function handleAddrKey(e) { if (e.key === 'Enter') { let url = e.target.value.trim(); if (!url.startsWith('http')) url = 'https://' + url; frame.src = url; document.getElementById('addr-prompt').classList.remove('open'); } }
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(console.warn); }); }
<\/script>
</body>
</html>`;
        }

        function generateIconSVG(name, accent, bg) {
            const letter = (name || "A")[0].toUpperCase();
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="110" fill="${bg}"/>
    <rect width="512" height="512" rx="110" fill="${accent}" opacity="0.15"/>
    <text x="256" y="340" text-anchor="middle" font-family="Arial Black, sans-serif"
        font-size="280" font-weight="900" fill="${accent}">${letter}</text>
</svg>`;
        }

        function generateDeployScript(cfg) {
            const dirName = cfg.name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
            return `#!/bin/bash
# PWA 部署脚本 - ${cfg.name}
# 使用方法: chmod +x deploy-${dirName}.sh && ./deploy-${dirName}.sh

set -e

# 配置
APP_NAME="${cfg.name}"
APP_DIR="${dirName}"
REPO="lemmomay/pwa-apps"
BRANCH="main"

echo "🚀 开始部署 PWA: $APP_NAME"
echo "📁 目录: $APP_DIR"
echo ""

# 检查 gh 是否安装
if ! command -v gh &> /dev/null; then
    echo "❌ 需要安装 GitHub CLI (gh)"
    echo "   安装方式: https://cli.github.com/"
    exit 1
fi

# 检查是否已登录
if ! gh auth status &> /dev/null; then
    echo "📝 请先登录 GitHub CLI:"
    gh auth login
fi

# 创建临时目录
TMPDIR=$(mktemp -d)
trap "rm -rf $TMPDIR" EXIT

echo "📦 生成文件..."

# 生成所有文件
cat > "$TMPDIR/index.html" << 'HTMLEOF'
${generateIndex(cfg)}
HTMLEOF

cat > "$TMPDIR/manifest.json" << 'JSONEOF'
${generateManifest(cfg)}
JSONEOF

cat > "$TMPDIR/sw.js" << 'SWEOF'
${generateSW(cfg)}
SWEOF

cat > "$TMPDIR/offline.html" << 'OFFLINEEOF'
${generateOffline(cfg)}
OFFLINEEOF

cat > "$TMPDIR/icon.svg" << 'SVGEOF'
${generateIconSVG(cfg.name, cfg.accentColor, cfg.bgColor)}
SVGEOF

echo "📤 上传到 GitHub..."

# 上传每个文件
for file in "$TMPDIR"/*; do
    filename=$(basename "$file")
    echo "   上传: $APP_DIR/$filename"
    gh api "repos/$REPO/contents/$APP_DIR/$filename" \
        --method PUT \
        -f message="Add PWA: $APP_NAME - $filename" \
        -f content="$(base64 -w0 "$file")" \
        -f branch="$BRANCH" \
        --silent 2>/dev/null || echo "   ⚠️ 文件可能已存在，跳过"
done

echo ""
echo "✅ 部署完成!"
echo ""
echo "🔗 访问地址: https://lemmomay.github.io/pwa-apps/$APP_DIR/"
echo ""
echo "📱 安装步骤:"
echo "   1. 在手机浏览器打开上面的链接"
echo "   2. 点击「安装到桌面」或使用浏览器菜单安装"
`;
        }

        function downloadFile(filename, content, mime = "text/plain") {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = filename; a.click();
            URL.revokeObjectURL(url);
        }

        function downloadAll(cfg) {
            const dirName = cfg.name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
            const files = {
                [`${dirName}/index.html`]: generateIndex(cfg),
                [`${dirName}/manifest.json`]: generateManifest(cfg),
                [`${dirName}/sw.js`]: generateSW(cfg),
                [`${dirName}/offline.html`]: generateOffline(cfg),
                [`${dirName}/icon.svg`]: generateIconSVG(cfg.name, cfg.accentColor, cfg.bgColor),
            };
            Object.entries(files).forEach(([name, content], i) => {
                setTimeout(() => downloadFile(name, content), i * 100);
            });
        }

        const TABS = ["index.html", "manifest.json", "sw.js", "offline.html", "icon.svg"];

        const COLORS = [
            { label: "暗夜蓝", theme: "#1a1a2e", bg: "#0f0f1a", accent: "#e94560" },
            { label: "深邃黑", theme: "#111111", bg: "#0a0a0a", accent: "#ff6b35" },
            { label: "午夜紫", theme: "#16002e", bg: "#0d0018", accent: "#a855f7" },
            { label: "森林绿", theme: "#0d1f12", bg: "#081510", accent: "#22c55e" },
            { label: "海洋蓝", theme: "#0a1628", bg: "#060e1a", accent: "#38bdf8" },
            { label: "玫瑰红", theme: "#1f0a0a", bg: "#120606", accent: "#f43f5e" },
        ];

        function PWAGenerator() {
            const [cfg, setCfg] = useState(DEFAULT_CONFIG);
            const [activeTab, setActiveTab] = useState("index.html");
            const [copied, setCopied] = useState(false);
            const [step, setStep] = useState(0);

            const files = {
                "index.html": generateIndex(cfg),
                "manifest.json": generateManifest(cfg),
                "sw.js": generateSW(cfg),
                "offline.html": generateOffline(cfg),
                "icon.svg": generateIconSVG(cfg.name, cfg.accentColor, cfg.bgColor),
            };

            const update = useCallback((key, val) => {
                setCfg(p => ({ ...p, [key]: val }));
            }, []);

            const copyCode = async () => {
                await navigator.clipboard.writeText(files[activeTab]);
                setCopied(true);
                setTimeout(() => setCopied(false), 1800);
            };

            const copyDeployScript = async () => {
                const script = generateDeployScript(cfg);
                await navigator.clipboard.writeText(script);
                alert('部署脚本已复制！\n\n保存为 deploy.sh 后运行:\nchmod +x deploy.sh && ./deploy.sh');
            };

            const inputStyle = {
                background: "#151520", border: "1px solid #252538",
                color: "#e8e8f0", padding: "8px 12px", borderRadius: 7,
                fontSize: 13, outline: "none", width: "100%", transition: "border-color 0.15s",
            };

            return (
                <div style={{ minHeight: "100vh", background: "#0c0c14", color: "#e8e8f0",
                    fontFamily: "'Segoe UI', system-ui, sans-serif", display: "flex", flexDirection: "column" }}>
                    {/* Header */}
                    <div style={{ borderBottom: "1px solid #1e1e32", padding: "0 24px",
                        display: "flex", alignItems: "center", gap: 12, height: 56, background: "#0e0e1a" }}>
                        <a href="./" style={{ textDecoration: 'none' }}>
                            <div style={{ width: 32, height: 32, borderRadius: 8, background: cfg.accentColor,
                                display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>📱</div>
                        </a>
                        <div>
                            <div style={{ fontWeight: 700, fontSize: 15 }}>PWA 生成器</div>
                            <div style={{ fontSize: 11, color: "#666", marginTop: -1 }}>将任意网站打包成真正的应用</div>
                        </div>
                        <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
                            {step === 1 && (
                                <>
                                    <button onClick={() => setStep(0)} style={{
                                        background: "transparent", border: "1px solid #333",
                                        color: "#aaa", padding: "6px 14px", borderRadius: 6,
                                        cursor: "pointer", fontSize: 13 }}>← 返回配置</button>
                                    <button onClick={() => downloadAll(cfg)} style={{
                                        background: '#333', border: "none", color: "#fff",
                                        padding: "6px 16px", borderRadius: 6,
                                        cursor: "pointer", fontSize: 13 }}>⬇ 下载文件</button>
                                    <button onClick={() => {
                                        const script = generateDeployScript(cfg);
                                        downloadFile(`deploy-${cfg.name.toLowerCase().replace(/[^a-z0-9]/g, '-')}.sh`, script);
                                    }} style={{
                                        background: '#22c55e', border: "none", color: "#fff",
                                        padding: "6px 16px", borderRadius: 6,
                                        cursor: "pointer", fontSize: 13, fontWeight: 600 }}>🚀 下载部署脚本</button>
                                </>
                            )}
                        </div>
                    </div>

                    <div style={{ display: "flex", flex: 1, overflow: "hidden" }}>
                        {/* Left Panel */}
                        <div style={{
                            width: step === 0 ? "100%" : 300,
                            borderRight: step === 1 ? "1px solid #1e1e32" : "none",
                            overflowY: "auto", padding: 24, display: "flex",
                            flexDirection: step === 0 ? "row" : "column",
                            flexWrap: step === 0 ? "wrap" : "nowrap",
                            gap: 20, alignContent: "flex-start",
                        }}>
                            <Field label="网站地址" style={{ flex: step === 0 ? "1 1 300px" : "none" }}>
                                <input value={cfg.url} onChange={e => update("url", e.target.value)}
                                    style={inputStyle} placeholder="https://example.com" />
                            </Field>
                            <Field label="应用名称" style={{ flex: step === 0 ? "1 1 200px" : "none" }}>
                                <input value={cfg.name} onChange={e => update("name", e.target.value)}
                                    style={inputStyle} placeholder="My App" />
                            </Field>
                            <Field label="短名称" style={{ flex: step === 0 ? "1 1 200px" : "none" }}>
                                <input value={cfg.shortName} onChange={e => update("shortName", e.target.value)}
                                    style={inputStyle} placeholder="App" />
                            </Field>
                            <Field label="应用描述" style={{ flex: step === 0 ? "1 1 300px" : "none" }}>
                                <input value={cfg.description} onChange={e => update("description", e.target.value)}
                                    style={inputStyle} />
                            </Field>
                            <Field label="配色方案" style={{ flex: step === 0 ? "1 1 100%" : "none" }}>
                                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                                    {COLORS.map(c => (
                                        <button key={c.label} onClick={() => {
                                            update("themeColor", c.theme);
                                            update("bgColor", c.bg);
                                            update("accentColor", c.accent);
                                        }} style={{
                                            background: c.bg, border: `2px solid ${cfg.themeColor === c.theme ? c.accent : "#333"}`,
                                            borderRadius: 8, padding: "6px 12px", cursor: "pointer",
                                            display: "flex", alignItems: "center", gap: 6, color: "#fff", fontSize: 12,
                                        }}>
                                            <span style={{ width: 10, height: 10, borderRadius: "50%", background: c.accent }}/>
                                            {c.label}
                                        </button>
                                    ))}
                                </div>
                            </Field>
                            <Field label="主题色" style={{ flex: step === 0 ? "0 0 auto" : "none" }}>
                                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                    <input type="color" value={cfg.themeColor} onChange={e => update("themeColor", e.target.value)}
                                        style={{ width: 40, height: 36, borderRadius: 6, border: "1px solid #333", cursor: "pointer", padding: 2 }} />
                                    <input value={cfg.themeColor} onChange={e => update("themeColor", e.target.value)}
                                        style={{ ...inputStyle, width: 100 }} />
                                </div>
                            </Field>
                            <Field label="背景色" style={{ flex: step === 0 ? "0 0 auto" : "none" }}>
                                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                    <input type="color" value={cfg.bgColor} onChange={e => update("bgColor", e.target.value)}
                                        style={{ width: 40, height: 36, borderRadius: 6, border: "1px solid #333", cursor: "pointer", padding: 2 }} />
                                    <input value={cfg.bgColor} onChange={e => update("bgColor", e.target.value)}
                                        style={{ ...inputStyle, width: 100 }} />
                                </div>
                            </Field>
                            <Field label="强调色" style={{ flex: step === 0 ? "0 0 auto" : "none" }}>
                                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                    <input type="color" value={cfg.accentColor} onChange={e => update("accentColor", e.target.value)}
                                        style={{ width: 40, height: 36, borderRadius: 6, border: "1px solid #333", cursor: "pointer", padding: 2 }} />
                                    <input value={cfg.accentColor} onChange={e => update("accentColor", e.target.value)}
                                        style={{ ...inputStyle, width: 100 }} />
                                </div>
                            </Field>
                            <Field label="显示模式" style={{ flex: step === 0 ? "1 1 200px" : "none" }}>
                                <select value={cfg.display} onChange={e => update("display", e.target.value)} style={inputStyle}>
                                    <option value="standalone">standalone (推荐)</option>
                                    <option value="fullscreen">fullscreen (全屏)</option>
                                    <option value="minimal-ui">minimal-ui</option>
                                </select>
                            </Field>
                            <Field label="屏幕方向" style={{ flex: step === 0 ? "1 1 180px" : "none" }}>
                                <select value={cfg.orientation} onChange={e => update("orientation", e.target.value)} style={inputStyle}>
                                    <option value="any">any (自动)</option>
                                    <option value="portrait">portrait (竖屏)</option>
                                    <option value="landscape">landscape (横屏)</option>
                                </select>
                            </Field>
                            <Field label="功能选项" style={{ flex: step === 0 ? "1 1 300px" : "none" }}>
                                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                                    <Toggle label="导航栏" checked={cfg.enableNavBar} onChange={v => update("enableNavBar", v)} accent={cfg.accentColor}/>
                                    <Toggle label="离线支持" checked={cfg.enableOffline} onChange={v => update("enableOffline", v)} accent={cfg.accentColor}/>
                                </div>
                            </Field>
                            {step === 0 && (
                                <div style={{ flex: "1 1 100%", display: "flex", justifyContent: "center", paddingTop: 8 }}>
                                    <button onClick={() => setStep(1)} style={{
                                        background: cfg.accentColor, border: "none", color: "#fff",
                                        padding: "12px 40px", borderRadius: 10, cursor: "pointer",
                                        fontSize: 15, fontWeight: 700, boxShadow: `0 0 30px ${cfg.accentColor}44`,
                                    }}>生成 PWA 文件 →</button>
                                </div>
                            )}
                        </div>

                        {/* Right Panel */}
                        {step === 1 && (
                            <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
                                <div style={{ display: "flex", borderBottom: "1px solid #1e1e32",
                                    background: "#0e0e1a", overflowX: "auto" }}>
                                    {TABS.map(t => (
                                        <button key={t} onClick={() => setActiveTab(t)} style={{
                                            background: activeTab === t ? "#0c0c14" : "transparent",
                                            border: "none", borderBottom: activeTab === t ? `2px solid ${cfg.accentColor}` : "2px solid transparent",
                                            color: activeTab === t ? "#fff" : "#666",
                                            padding: "10px 18px", cursor: "pointer", fontSize: 13,
                                            whiteSpace: "nowrap", fontFamily: "monospace",
                                        }}>{t}</button>
                                    ))}
                                    <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", padding: "0 16px", gap: 8 }}>
                                        <button onClick={copyCode} style={{
                                            background: copied ? "#22c55e22" : "#1e1e32",
                                            border: `1px solid ${copied ? "#22c55e" : "#333"}`,
                                            color: copied ? "#22c55e" : "#aaa", padding: "4px 12px",
                                            borderRadius: 6, cursor: "pointer", fontSize: 12,
                                        }}>{copied ? "✓ 已复制" : "复制"}</button>
                                    </div>
                                </div>
                                <div style={{ flex: 1, overflowY: "auto", padding: 20 }}>
                                    <pre style={{ margin: 0, fontSize: 12, lineHeight: 1.65,
                                        color: "#c8d3f5", fontFamily: "monospace",
                                        whiteSpace: "pre-wrap", wordBreak: "break-all" }}>
                                        <code>{files[activeTab]}</code>
                                    </pre>
                                </div>
                                <div style={{ padding: "16px 24px", borderTop: "1px solid #1e1e32",
                                    background: "#0e0e1a", fontSize: 13, color: "#888", lineHeight: 1.7 }}>
                                    <strong style={{ color: "#aaa" }}>📋 部署方式：</strong>
                                    <br/>
                                    <span style={{ color: "#22c55e" }}>方式1 - 下载部署脚本：</span>点击「🚀 下载部署脚本」→ 本地运行脚本自动部署
                                    <br/>
                                    <span style={{ color: "#38bdf8" }}>方式2 - 手动部署：</span>点击「⬇ 下载文件」→ 解压到仓库目录 → git push
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function Field({ label, children, style }) {
            return (
                <div style={{ display: "flex", flexDirection: "column", gap: 6, ...style }}>
                    <label style={{ fontSize: 12, color: "#666", fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }}>
                        {label}
                    </label>
                    {children}
                </div>
            );
        }

        function Toggle({ label, checked, onChange, accent }) {
            return (
                <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
                    <div onClick={() => onChange(!checked)} style={{
                        width: 38, height: 22, borderRadius: 11,
                        background: checked ? accent : "#333",
                        position: "relative", transition: "background 0.2s", flexShrink: 0,
                    }}>
                        <div style={{
                            position: "absolute", top: 3, left: checked ? 19 : 3,
                            width: 16, height: 16, borderRadius: "50%", background: "#fff",
                            transition: "left 0.2s", boxShadow: "0 1px 3px rgba(0,0,0,0.3)",
                        }}/>
                    </div>
                    <span style={{ fontSize: 13, color: "#aaa" }}>{label}</span>
                </label>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<PWAGenerator />);
    </script>
</body>
</html>

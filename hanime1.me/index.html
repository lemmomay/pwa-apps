<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hanime1">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Hanime1</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root { color-scheme: dark; --bg: #09090f; --card: rgba(255,255,255,.08); --line: rgba(255,255,255,.14); --text: #fff; --muted: #a1a1aa; --accent: #fb7185; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 25% 10%, rgba(251,113,133,.28), transparent 28rem), var(--bg); color: var(--text); display: grid; place-items: center; padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom)); }
        main { width: min(480px, 100%); }
        .card { border: 1px solid var(--line); border-radius: 32px; padding: 28px; background: linear-gradient(180deg, var(--card), rgba(255,255,255,.045)); box-shadow: 0 28px 90px rgba(0,0,0,.38); }
        .icon { width: 88px; height: 88px; border-radius: 25px; display: grid; place-items: center; background: linear-gradient(135deg, #fb7185, #f43f5e); color: #19070a; font-size: 44px; font-weight: 900; box-shadow: 0 18px 44px rgba(244,63,94,.34); }
        h1 { margin: 24px 0 8px; font-size: 44px; line-height: .95; letter-spacing: -.07em; }
        .domain { color: var(--accent); font-size: 15px; word-break: break-all; }
        p { color: var(--muted); line-height: 1.7; margin: 22px 0 0; }
        .actions { display: grid; gap: 12px; margin-top: 28px; }
        button, a.button { border: 0; border-radius: 18px; padding: 16px 18px; font: inherit; font-weight: 750; text-decoration: none; text-align: center; cursor: pointer; }
        .primary { background: var(--accent); color: #19070a; }
        .secondary { background: rgba(255,255,255,.1); color: var(--text); border: 1px solid var(--line); }
        .install-hint { margin-top: 16px; border-radius: 20px; padding: 15px; border: 1px solid var(--line); background: rgba(255,255,255,.055); color: var(--muted); font-size: 14px; line-height: 1.65; }
        .hidden { display: none; }
        .back { display: inline-block; margin-top: 18px; color: var(--muted); text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <main>
        <section class="card" aria-labelledby="app-title">
            <div class="icon">H</div>
            <h1 id="app-title">Hanime1</h1>
            <div class="domain">hanime1.me</div>
            <p>这是一个稳定的 PWA 启动壳。安装后从桌面打开，再手动进入目标网站；不再使用跨域 iframe，避免空白页、导航失效和被站点策略拦截。</p>
            <div class="actions">
                <button class="primary" id="install-btn" type="button">安装到桌面</button>
                <a class="button secondary" href="https://hanime1.me" rel="noopener">打开目标网站</a>
            </div>
            <div class="install-hint" id="hint">如果没有看到安装按钮，请使用浏览器菜单中的“添加到主屏幕”或“安装应用”。</div>
        </section>
        <a class="back" href="../">返回应用列表</a>
    </main>
    <script>
        const targetUrl = 'https://hanime1.me';
        let deferredPrompt;
        const installButton = document.getElementById('install-btn');
        const hint = document.getElementById('hint');
        const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        if (standalone) hint.textContent = '已从桌面模式启动。点击“打开目标网站”进入网站。';

        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredPrompt = event;
            hint.textContent = '当前浏览器支持一键安装。安装后可从桌面图标启动。';
        });

        installButton.addEventListener('click', async () => {
            if (!deferredPrompt) {
                showInstallGuide();
                return;
            }
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = undefined;
        });

        function showInstallGuide() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            hint.textContent = isIOS
                ? 'iOS 安装：点击 Safari 分享按钮，然后选择“添加到主屏幕”。'
                : 'Android 安装：点击浏览器菜单，选择“安装应用”或“添加到主屏幕”。如果菜单里没有安装项，请等待页面加载完成后刷新一次。';
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
        }
    </script>
</body>
</html>

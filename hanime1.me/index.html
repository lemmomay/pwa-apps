<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>Hanime1</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
        }
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .app-icon {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            background: #fff;
            object-fit: contain;
        }
        .app-name {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        .app-url {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 40px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 300px;
        }
        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-install {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn-install:hover {
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }
        .btn-open {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-open:hover {
            background: rgba(255,255,255,0.15);
        }
        .btn-icon {
            font-size: 20px;
        }
        .hint {
            margin-top: 30px;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            max-width: 320px;
        }
        .hint-title {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }
        .hint-text {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
        }
        .installed-badge {
            display: none;
            padding: 8px 16px;
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 20px;
            color: #4CAF50;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .installed-badge.show {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="installed-badge" id="installedBadge">
            <span>✓</span> 已安装为 PWA
        </div>
        
        <img class="app-icon" id="appIcon" src="" alt="icon">
        <div class="app-name">Hanime1</div>
        <div class="app-url">hanime1.me</div>
        
        <div class="btn-group">
            <button class="btn btn-install" id="installBtn" onclick="installPWA()">
                <span class="btn-icon">📲</span>
                安装到桌面
            </button>
            <button class="btn btn-open" onclick="openSite()">
                <span class="btn-icon">🌐</span>
                直接打开网站
            </button>
        </div>
        
        <div class="hint">
            <div class="hint-title">💡 为什么要安装？</div>
            <div class="hint-text">
                安装后可获得：<br>
                • 桌面图标，一键启动<br>
                • 全屏体验，无地址栏<br>
                • 更快的加载速度
            </div>
        </div>
    </div>

    <script>
        const SITE_URL = 'https://hanime1.me';
        const SITE_DOMAIN = 'hanime1.me';
        
        // 加载网站图标
        function loadFavicon() {
            const icon = document.getElementById('appIcon');
            // 使用 Google Favicons API
            icon.src = `https://www.google.com/s2/favicons?domain=${SITE_DOMAIN}&sz=128`;
            icon.onerror = function() {
                // 备用：使用网站自己的 favicon
                this.src = `https://${SITE_DOMAIN}/favicon.ico`;
                this.onerror = function() {
                    // 最终备用：显示首字母
                    this.style.display = 'none';
                };
            };
        }
        
        // 检测是否已安装为PWA
        function checkInstalled() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
                || window.navigator.standalone === true;
            
            if (isStandalone) {
                document.getElementById('installedBadge').classList.add('show');
                document.getElementById('installBtn').style.display = 'none';
                // 已安装，自动跳转
                setTimeout(() => window.location.href = SITE_URL, 500);
            }
        }
        
        // 安装PWA
        let deferredPrompt = null;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });
        
        async function installPWA() {
            if (deferredPrompt) {
                // Android Chrome
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    window.location.href = SITE_URL;
                }
                deferredPrompt = null;
            } else {
                // iOS Safari 或其他浏览器 - 显示手动安装指引
                showInstallGuide();
            }
        }
        
        function showInstallGuide() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            
            let guide = '';
            if (isIOS || isSafari) {
                guide = `iOS 安装步骤：
1. 点击底部「分享」按钮 ⬆️
2. 向下滑动找到「添加到主屏幕」
3. 点击「添加」完成安装`;
            } else {
                guide = `安装步骤：
1. 点击浏览器菜单 ⋮
2. 选择「安装应用」或「添加到桌面」
3. 确认安装`;
            }
            
            alert(guide);
        }
        
        function openSite() {
            window.location.href = SITE_URL;
        }
        
        // 初始化
        loadFavicon();
        checkInstalled();
    </script>
</body>
</html>

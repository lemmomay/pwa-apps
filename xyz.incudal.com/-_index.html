<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="App">
<meta name="mobile-web-app-capable" content="yes">
<title>怀旧服</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #060e1a; }
    #splash { position: fixed; inset: 0; z-index: 9999; background: #060e1a;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 24px; transition: opacity 0.5s ease, visibility 0.5s ease; }
    #splash.hidden { opacity: 0; visibility: hidden; }
    .splash-logo { width: 96px; height: 96px; border-radius: 22px; background: #38bdf8;
        display: flex; align-items: center; justify-content: center; font-size: 2.8rem;
        box-shadow: 0 0 60px #38bdf866; animation: logoIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .splash-title { color: #fff; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.02em;
        animation: fadeUp 0.5s ease 0.2s both; }
    .splash-loader { width: 180px; height: 3px; background: rgba(255,255,255,0.1);
        border-radius: 999px; overflow: hidden; animation: fadeUp 0.5s ease 0.3s both; }
    .splash-loader-bar { height: 100%; background: #38bdf8;
        border-radius: 999px; width: 0%; animation: loading 1.8s ease forwards; }
    @keyframes logoIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
    @keyframes fadeUp { from{transform:translateY(12px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes loading { 0%{width:0%} 60%{width:75%} 100%{width:100%} }
    #webview { width: 100%; height: 100vh; border: none; display: block; background: #060e1a; }
    
    #nav-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
        background: #0a1628ee; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        display: flex; align-items: center; gap: 4px; padding: 6px 8px;
        border-bottom: 1px solid rgba(255,255,255,0.08); height: 52px; }
    #nav-bar button { background: rgba(255,255,255,0.08); border: none; color: #fff;
        width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center;
        justify-content: center; cursor: pointer; transition: background 0.15s; flex-shrink: 0; }
    #nav-bar button:hover { background: rgba(255,255,255,0.16); }
    #nav-bar button:active { background: rgba(255,255,255,0.24); transform: scale(0.94); }
    #url-display { flex: 1; background: rgba(255,255,255,0.07); border-radius: 8px;
        height: 36px; padding: 0 12px; display: flex; align-items: center;
        color: rgba(255,255,255,0.6); font-size: 13px; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: background 0.15s; }
    #url-display:hover { background: rgba(255,255,255,0.12); }
    #webview { margin-top: 52px; height: calc(100vh - 52px); }
    #addr-prompt { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.7);
        backdrop-filter: blur(8px); display: none; align-items: flex-start; justify-content: center;
        padding-top: 60px; }
    #addr-prompt.open { display: flex; }
    #addr-input-wrap { background: #222; border-radius: 14px; padding: 12px;
        width: calc(100% - 32px); max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    #addr-input { width: 100%; background: #333; border: none; color: #fff;
        border-radius: 8px; padding: 10px 14px; font-size: 15px; outline: none; }
    #addr-hint { color: #666; font-size: 12px; margin-top: 8px; padding: 0 4px; }
</style>
</head>
<body>
<div id="splash">
    <div class="splash-logo">🎬</div>
    <div class="splash-title">怀旧服</div>
    <div class="splash-loader"><div class="splash-loader-bar"></div></div>
</div>

    <div id="nav-bar">
        <button id="btn-back" onclick="goBack()" title="后退">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button id="btn-forward" onclick="goForward()" title="前进">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div id="url-display" onclick="showAddressBar()"></div>
        <button id="btn-refresh" onclick="refreshFrame()" title="刷新">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <button id="btn-home" onclick="goHome()" title="主页">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
    </div>
<iframe id="webview" src="https://xyz.incudal.com"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation allow-modals"
    allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<div id="addr-prompt" onclick="closeAddressBar(event)">
    <div id="addr-input-wrap">
        <input id="addr-input" type="url" placeholder="输入网址..." autocomplete="off" onkeydown="handleAddrKey(event)">
        <div id="addr-hint">按 Enter 跳转 · 点击外部关闭</div>
    </div>
</div>
<script>
const HOME_URL = 'https://xyz.incudal.com';
const frame = document.getElementById('webview');
const splash = document.getElementById('splash');
const urlDisplay = document.getElementById('url-display');
frame.addEventListener('load', () => { setTimeout(() => { splash.classList.add('hidden'); }, 400); updateUrlDisplay(); });
setTimeout(() => { splash.classList.add('hidden'); }, 2500);
function updateUrlDisplay() { try { const u = frame.contentWindow?.location?.href || HOME_URL; if (urlDisplay) urlDisplay.textContent = u.replace(/^https?:\/\//, ''); } catch(e) { if (urlDisplay) urlDisplay.textContent = HOME_URL.replace(/^https?:\/\//, ''); } }
function goBack() { try { frame.contentWindow.history.back(); } catch(e) {} }
function goForward() { try { frame.contentWindow.history.forward(); } catch(e) {} }
function refreshFrame() { try { frame.contentWindow.location.reload(); } catch(e) { frame.src = frame.src; } }
function goHome() { frame.src = HOME_URL; }
function showAddressBar() { document.getElementById('addr-prompt').classList.add('open'); document.getElementById('addr-input').focus(); }
function closeAddressBar(e) { if (e.target === document.getElementById('addr-prompt')) document.getElementById('addr-prompt').classList.remove('open'); }
function handleAddrKey(e) { if (e.key === 'Enter') { let url = e.target.value.trim(); if (!url.startsWith('http')) url = 'https://' + url; frame.src = url; document.getElementById('addr-prompt').classList.remove('open'); } }
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(console.warn); }); }
</script>
</body>
</html>

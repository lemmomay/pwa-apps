<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f0c29">
    <title>Incudal</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s, transform 0.5s;
        }
        .splash.hide {
            opacity: 0;
            transform: scale(1.1);
        }
        .app-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(240, 147, 251, 0.4);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .app-name {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        .app-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }
        .launch-btn {
            padding: 16px 48px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.4);
        }
        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(240, 147, 251, 0.5);
        }
        .launch-btn:active {
            transform: translateY(0);
        }
        .countdown {
            margin-top: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #f093fb, #f5576c);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div class="splash" id="splash">
        <div class="app-icon">📦</div>
        <div class="app-name">Incudal</div>
        <div class="app-desc">xyz.incudal.com</div>
        <button class="launch-btn" onclick="launch()">立即打开</button>
        <div class="countdown" id="countdown">3 秒后自动跳转</div>
        <div class="progress-bar" id="progress"></div>
    </div>

    <script>
        const TARGET_URL = 'https://xyz.incudal.com';
        let countdown = 3;
        let launched = false;

        function launch() {
            if (launched) return;
            launched = true;
            
            const splash = document.getElementById('splash');
            splash.classList.add('hide');
            
            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, 500);
        }

        const timer = setInterval(() => {
            countdown--;
            document.getElementById('countdown').textContent = countdown + ' 秒后自动跳转';
            document.getElementById('progress').style.width = ((3 - countdown) / 3 * 100) + '%';
            
            if (countdown <= 0) {
                clearInterval(timer);
                launch();
            }
        }, 1000);
    </script>
</body>
</html>
